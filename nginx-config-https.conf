# 图片字幕生成器 - HTTPS版本Nginx配置
# 域名: subtitle.hnwen17.top
# 项目类型: 纯静态站点 + SSL/TLS加密
# 优化目标: 安全性、性能、用户体验

# HTTP自动跳转HTTPS
server
{
    listen 80;
    listen [::]:80;
    server_name subtitle.hnwen17.top;

    # 强制跳转到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS主配置
server
{
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name subtitle.hnwen17.top;

    # 静态站点配置
    index index.html index.htm;
    root /www/wwwroot/subtitle-generator;

    # 字符编码
    charset utf-8;

    # 文件上传大小限制（用户上传图片最大10MB）
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # ============================================
    # SSL证书配置（请替换为实际路径）
    # ============================================

    #SSL-START SSL相关配置
    # 证书文件路径（申请SSL后宝塔会自动填充）
    ssl_certificate    /www/server/panel/vhost/cert/subtitle.hnwen17.top/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/subtitle.hnwen17.top/privkey.pem;

    # SSL协议版本（仅支持安全版本）
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL加密套件（优先使用高强度加密）
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4:!DH:!DHE;
    ssl_prefer_server_ciphers on;

    # SSL会话缓存（提升HTTPS性能）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling（在线证书状态协议）
    ssl_stapling on;
    ssl_stapling_verify on;

    # SSL缓冲区大小优化
    ssl_buffer_size 1400;

    # 预加载HSTS（强制使用HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #SSL-END

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/subtitle.hnwen17.top.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/subtitle.hnwen17.top/*.conf;

    # ============================================
    # 安全响应头配置（增强版）
    # ============================================

    # 防止点击劫持攻击
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止MIME类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 启用XSS过滤器
    add_header X-XSS-Protection "1; mode=block" always;

    # 引荐来源策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略（禁用不需要的浏览器功能）
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (内容安全策略)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # ============================================
    # Gzip压缩配置（性能优化）
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ============================================
    # 错误页面配置
    # ============================================

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # ============================================
    # 静态文件缓存策略（性能优化）
    # ============================================

    # 图片文件 - 缓存7天
    location ~* \.(gif|jpg|jpeg|png|bmp|ico|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # CSS和JavaScript文件 - 缓存7天
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # 字体文件 - 缓存30天
    location ~* \.(ttf|ttc|otf|eot|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # HTML文件 - 不缓存（便于更新）
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # 安全性配置 - 禁止访问敏感文件
    # ============================================

    # 禁止访问隐藏文件和敏感文件
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md|package\.json|\.gitignore)$ {
        deny all;
        return 404;
    }

    # 禁止访问备份文件和临时文件
    location ~* \.(bak|backup|swp|tmp|log|sql|gz|zip|rar)$ {
        deny all;
        return 404;
    }

    # ============================================
    # SSL证书验证目录配置
    # ============================================

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ============================================
    # 主要路由配置
    # ============================================

    # 根路径配置
    location / {
        # SPA路由支持
        try_files $uri $uri/ /index.html;

        # 禁用目录浏览
        autoindex off;
    }

    # 禁止访问.开头的隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # URL重写规则
    # ============================================

    #REWRITE-START URL重写规则引用
    include /www/server/panel/vhost/rewrite/subtitle.hnwen17.top.conf;
    #REWRITE-END

    # ============================================
    # 日志配置
    # ============================================

    access_log  /www/wwwlogs/subtitle.hnwen17.top.log;
    error_log   /www/wwwlogs/subtitle.hnwen17.top.error.log;
}
