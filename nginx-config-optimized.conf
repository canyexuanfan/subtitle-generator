# 图片字幕生成器 - 优化后的Nginx配置
# 域名: subtitle.hnwen17.top
# 项目类型: 纯静态站点
# 优化目标: 安全性、性能、用户体验

server
{
    listen 80;
    listen [::]:80;
    server_name subtitle.hnwen17.top;

    # 静态站点配置
    index index.html index.htm;
    root /www/wwwroot/subtitle-generator;

    # 字符编码
    charset utf-8;

    # 文件上传大小限制（用户上传图片最大10MB）
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/subtitle.hnwen17.top.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/subtitle.hnwen17.top/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    # ============================================
    # 安全响应头配置（重要！）
    # ============================================

    # 防止点击劫持攻击
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止MIME类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 启用XSS过滤器
    add_header X-XSS-Protection "1; mode=block" always;

    # 引荐来源策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略（禁用不需要的浏览器功能）
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (内容安全策略)
    # 注意: 如果您的代码使用了内联样式/脚本,可能需要调整
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ============================================
    # Gzip压缩配置（性能优化）
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ============================================
    # 错误页面配置
    # ============================================

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    #ERROR-PAGE-END

    # ============================================
    # 静态文件缓存策略（性能优化）
    # ============================================

    # 图片文件 - 缓存7天
    location ~* \.(gif|jpg|jpeg|png|bmp|ico|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # CSS和JavaScript文件 - 缓存7天
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # 字体文件 - 缓存30天
    location ~* \.(ttf|ttc|otf|eot|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
    }

    # HTML文件 - 不缓存（便于更新）
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # 安全性配置 - 禁止访问敏感文件
    # ============================================

    # 禁止访问隐藏文件和敏感文件
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md|package\.json|\.gitignore)$ {
        deny all;
        return 404;
    }

    # 禁止访问备份文件和临时文件
    location ~* \.(bak|backup|swp|tmp|log|sql|gz|zip|rar)$ {
        deny all;
        return 404;
    }

    # ============================================
    # SSL证书验证目录配置
    # ============================================

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ============================================
    # 主要路由配置
    # ============================================

    # 根路径配置
    location / {
        # SPA路由支持（如果需要的话）
        try_files $uri $uri/ /index.html;

        # 禁用目录浏览
        autoindex off;
    }

    # 禁止访问.开头的隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # PHP配置（纯静态站点不需要,已注释）
    # ============================================

    # 纯静态站点,不需要PHP支持
    # 如果未来需要PHP功能,取消下面的注释
    # #PHP-INFO-START  PHP引用配置，可以注释或修改
    # include enable-php-00.conf;
    # #PHP-INFO-END

    # ============================================
    # URL重写规则
    # ============================================

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/subtitle.hnwen17.top.conf;
    #REWRITE-END

    # ============================================
    # 日志配置
    # ============================================

    access_log  /www/wwwlogs/subtitle.hnwen17.top.log;
    error_log   /www/wwwlogs/subtitle.hnwen17.top.error.log;
}
